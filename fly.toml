app = "tone-zone-api"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Single-instance assumption: api/cache.py holds image bytes in process memory.
  # If we scale beyond one machine, ingest and analyze can land on different
  # instances and the second sees image_not_found. Move the cache to Upstash/Redis
  # before raising this cap.
  max_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
